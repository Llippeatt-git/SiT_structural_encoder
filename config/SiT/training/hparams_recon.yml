MODEL: sit

mesh_resolution:
  ico_res: 6     ## full mesh resolution
  ico_down_res: 2     ## patching grid resolution

data:
  path_to_workdir: /ceph/chpc/shared/janine_bijsterbosch_group/lucas_scratch/HCP_YA
  task: scan_age #scan_age # birth_age
  testing_task: sex

logging:
  folder_to_save_model: /ceph/chpc/shared/janine_bijsterbosch_group/lucas_scratch/logs/SiT
  folder_to_save_recons: /ceph/chpc/shared/janine_bijsterbosch_group/lucas_scratch/logs/SiT/recons

training:
  LR: 0.005
  bs: 32
  bs_val: 1 #always 1
  epochs: 100
  gpu: 0
  loss: mse #mse, l1
  demeaned: True
  val_epoch: 2
  init_weights: False
  weights_source: /ceph/chpc/shared/janine_bijsterbosch_group/lucas_scratch/logs/SiT/best_run_reconsit
  
transformer:
  dim: 192 #192, 384, 768
  depth: 12 #12, 12, 12
  dec_depth: 4 # 1 2 4 
  heads: 6 #3, 6, 12
  latent_dim: 768
  mlp_dim: 768 #768, 1536, 3072 ## 4*dim according to DeiT
  pool: 'cls'  # or 'mean'
  num_classes: 1
  num_channels: 1
  dim_head: 64 #64
  dropout: 0.0
  emb_dropout: 0.0
  model: SiT

optimisation:
  optimiser: AdamW #Adam, AdamW, SGD

Adam:
  weight_decay: 0.

AdamW:
  weight_decay: 0.
SGD:
  weight_decay: 0.
  momentum: 0.9
  nesterov: False
  
StepLR: 
  stepsize: 1000
  decay: 0.5

CosineDecay:
  T_max: 5000
  eta_min: 0.0001

sub_ico_0:
    num_patches: 20 
    num_vertices: 2145 

sub_ico_1:
    num_patches: 80 
    num_vertices: 561 

sub_ico_2:
    num_patches: 320
    num_vertices: 153 
  
sub_ico_3:
    num_patches: 1280
    num_vertices: 45

augmentation: 
  prob_augmentation: 0.0
  warp_ico: 2